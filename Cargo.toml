[package]
name = "clicky"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "global_shortcuts", "screenshot"] }
base64 = "0.23.1"
cpal = "0.18.2"
dirs = "7.0.0"
env_logger = "0.11.11"
futures-util = "0.3.34"
gtk = "0.18"
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }
webkit2gtk = { version = "2.0", features = ["v2_40"] }
javascriptcore-rs = "1.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
log = "0.4.35"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "native-tls", "http2", "charset"] }
rodio = "0.23.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
toml = "1.1.8"
url = "2.5.8"
zbus = { version = "5", default-features = false, features = ["tokio"] }

[build-dependencies]
tauri-build = "2.7.4"

# Image decoding/encoding and audio are painfully slow unoptimized; optimize
# dependencies even in dev builds while keeping our own code fast to compile.
[profile.dev.package."*"]
opt-level = 3
